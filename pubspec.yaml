name: picturo_app
description: "A English Learning app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  lottie: ^3.3.1
  cupertino_icons: ^1.0.8
  carousel_slider: ^4.2.1
  animated_toggle_switch: ^0.8.4
  location: ^8.0.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0 
  flutter_svg: ^2.1.0
  shimmer: ^3.0.0
  dotted_border: ^2.1.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  http: ^1.3.0
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.5
  provider: ^6.1.2
  fluttertoast: ^8.2.12
  flutter_launcher_icons: ^0.14.4   # safest (from iOS newer)
  razorpay_flutter: ^1.4.0
  socket_io_client: ^3.0.2
  intl: ^0.20.2
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^5.2.1
  speech_to_text: ^7.0.0
  permission_handler: ^12.0.0
  flutter_tts: ^4.2.3
  cached_network_image: ^3.4.1
  go_router: ^15.1.1
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  just_audio: ^0.10.1
  firebase_analytics: ^11.4.5
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.6
  cloud_firestore: ^5.6.7
  googleapis_auth: ^2.0.0
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.1
  flutter_vector_icons: ^2.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  flutter_callkit_incoming: ^2.5.2
  audio_session: ^0.2.2
  animations: ^2.0.11
  share_plus: ^11.0.0
  phone_state: ^2.1.1
  in_app_review: ^2.0.10
  flutter_webrtc: ^0.14.2
  vibration: ^3.1.3
  device_info_plus: ^11.5.0
  get: ^4.7.2
  flutter_background_service: ^5.1.0
  workmanager: ^0.9.0+3
  google_mlkit_translation: ^0.13.0
  translator_plus: ^1.0.1
  url_launcher: ^6.3.2
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# ICON CONFIG (merged safe)
flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#241065"
  adaptive_icon_foreground: "assets/app_icon.png"
  remove_alpha_ios: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#241065"
  adaptive_icon_foreground: "assets/app_icon.png"

